name: Publish catalog

# Signs a new index.json from what catalog/ records and publishes it as the release marked
# latest, where StudioVD fetches it. Run by hand after catalog/ changes, and monthly so the
# index never expires (catalog/catalog.json validDays; the app installs nothing from an
# expired index). Every run takes the next sequence: the app refuses anything older.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 1 * *"

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    # The signing secrets live in this environment (Settings › Environments).
    environment: catalog-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install minisign
        run: sudo apt-get update -qq && sudo apt-get install -y minisign

      - name: Next sequence
        id: seq
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh release list --limit 1000 --json tagName --jq '.[].tagName' \
            | sed -n 's/^catalog-\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1)
          echo "sequence=$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"

      - name: Build index.json
        run: node tools/build-index.mjs --sequence ${{ steps.seq.outputs.sequence }} --key keys/active.pub

      - name: Sign with the active key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: tools/sign.sh keys/active.pub

      - name: Release as latest
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ steps.seq.outputs.sequence }}
        run: |
          key=$(jq -r .signingKeyId dist/index.json)
          expires=$(jq -r .expiresAt dist/index.json)
          # A draft first, so the release is never seen without both files.
          gh release create "catalog-$N" dist/index.json dist/index.json.minisig --draft \
            --target "$GITHUB_SHA" --title "Catalog $N" \
            --notes "Signed catalog index, sequence $N (minisign key $key), valid until $expires."
          gh release edit "catalog-$N" --draft=false --latest

      - name: Smoke test what StudioVD will fetch
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
          mkdir -p smoke
          for attempt in 1 2 3 4 5 6; do
            curl -fsSL -o smoke/index.json "$base/index.json" \
              && curl -fsSL -o smoke/index.json.minisig "$base/index.json.minisig" \
              && cmp -s smoke/index.json dist/index.json && break
            sleep 10
          done
          cmp smoke/index.json dist/index.json
          cmp smoke/index.json.minisig dist/index.json.minisig
          minisign -Vm smoke/index.json -p keys/active.pub
